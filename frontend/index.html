<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Savir Cloud - Login</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .toggle-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: var(--accent-coral);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
    }
    .toggle-link:hover { text-decoration: underline; }
  </style>
</head>
<body class="login-body">
  <div class="login-container">
    
    <!-- LOGIN CARD -->
    <div class="login-card" id="login-view">
      <h2>Savir Cloud</h2>
      <p style="text-align:center; color:var(--text-secondary); margin-top:-20px; margin-bottom:20px;">Gestão Empresarial AWS</p>
      
      <div id="login-error" class="hidden" style="color:var(--danger); background:rgba(239,68,68,0.1); padding:10px; border-radius:8px; margin-bottom:15px; font-weight:600; text-align:center;"></div>
      
      <form id="login-form">
        <div class="form-group">
          <label for="login">Usuário</label>
          <input type="text" id="login" placeholder="Digite seu login" required>
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" placeholder="Digite sua senha" required>
        </div>
        <button type="submit" class="btn btn-primary" id="btn-login" style="width:100%; padding:14px; margin-top:10px; justify-content:center;">Entrar</button>
      </form>
      
      <a class="toggle-link" onclick="toggleView('register')">Não tem conta? Cadastre-se aqui</a>
      
      <p style="text-align:center; margin-top:30px; color:#94a3b8; font-size:0.8rem; font-weight:500;">
        Arquitetura: Java 17 + Microserviços + GRASP
      </p>
    </div>

    <!-- REGISTER CARD -->
    <div class="login-card hidden" id="register-view">
      <h2>Criar Conta</h2>
      <p style="text-align:center; color:var(--text-secondary); margin-top:-20px; margin-bottom:20px;">Junte-se ao Savir Cloud</p>
      
      <div id="register-msg" class="hidden" style="padding:10px; border-radius:8px; margin-bottom:15px; font-weight:600; text-align:center;"></div>
      
      <form id="register-form">
        <div class="form-group">
          <label for="reg-name">Nome Completo</label>
          <input type="text" id="reg-name" placeholder="Ex: João Silva" required>
        </div>
        <div class="form-group">
          <label for="reg-email">E-mail</label>
          <input type="email" id="reg-email" placeholder="Ex: joao@email.com" required>
        </div>
        <div class="form-group">
          <label for="reg-login">Login de Usuário</label>
          <input type="text" id="reg-login" placeholder="Ex: joao.silva" required>
        </div>
        <div class="form-group">
          <label for="reg-password">Crie uma Senha</label>
          <input type="password" id="reg-password" required>
        </div>
        <button type="submit" class="btn btn-primary" id="btn-register" style="width:100%; padding:14px; margin-top:10px; justify-content:center;">Criar Conta Grátis</button>
      </form>
      
      <a class="toggle-link" style="color:var(--text-secondary)" onclick="toggleView('login')">Voltar para o Login</a>
    </div>

  </div>

  <script src="js/app.js"></script>
  <script>
    if (isLoggedIn()) window.location.href = 'dashboard.html';

    // View Toggling
    function toggleView(view) {
      document.getElementById('login-error').classList.add('hidden');
      document.getElementById('register-msg').classList.add('hidden');
      if (view === 'register') {
        document.getElementById('login-view').classList.add('hidden');
        document.getElementById('register-view').classList.remove('hidden');
      } else {
        document.getElementById('register-view').classList.add('hidden');
        document.getElementById('login-view').classList.remove('hidden');
      }
    }

    // Login Form
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      const err = document.getElementById('login-error');
      btn.textContent = 'Entrando...'; btn.disabled = true;
      err.classList.add('hidden');
      try {
        await login(document.getElementById('login').value, document.getElementById('password').value);
      } catch (ex) {
        err.textContent = ex.message; err.classList.remove('hidden');
        btn.textContent = 'Entrar'; btn.disabled = false;
      }
    });

    // Register Form
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-register');
      const msgBox = document.getElementById('register-msg');
      btn.textContent = 'Criando conta...'; btn.disabled = true;
      msgBox.classList.add('hidden');
      
      const payload = {
        name: document.getElementById('reg-name').value,
        email: document.getElementById('reg-email').value,
        login: document.getElementById('reg-login').value,
        password: document.getElementById('reg-password').value,
        profile: 'Usuário' // Default profile
      };

      try {
        const response = await fetch(AUTH_URL + '/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        
        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error || 'Erro ao criar conta');
        }
        
        // Success
        msgBox.textContent = 'Conta criada com sucesso! Faça login para entrar.';
        msgBox.style.color = '#10b981'; // Success Green
        msgBox.style.background = 'rgba(16, 185, 129, 0.1)';
        msgBox.classList.remove('hidden');
        
        document.getElementById('register-form').reset();
        btn.textContent = 'Criar Conta Grátis'; btn.disabled = false;
        
        // Auto-switch to login after 2 seconds
        setTimeout(() => toggleView('login'), 2000);
      } catch (ex) {
        msgBox.textContent = ex.message;
        msgBox.style.color = 'var(--danger)';
        msgBox.style.background = 'rgba(239, 68, 68, 0.1)';
        msgBox.classList.remove('hidden');
        btn.textContent = 'Criar Conta Grátis'; btn.disabled = false;
      }
    });
  </script>
</body>
</html>
