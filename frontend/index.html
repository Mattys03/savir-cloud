<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Savir Cloud - Login</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .auth-wrapper {
      display: flex;
      width: 900px;
      max-width: 95vw;
      min-height: 560px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    }
    .auth-brand {
      flex: 1;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 3rem;
      color: #ffffff;
      text-align: center;
    }
    .auth-brand svg {
      width: 56px; height: 56px;
      color: #f97316;
      margin-bottom: 1.5rem;
    }
    .auth-brand h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 0.75rem;
    }
    .auth-brand p {
      font-size: 1rem;
      color: #94a3b8;
      line-height: 1.6;
      max-width: 260px;
    }
    .auth-brand .tech-badges {
      margin-top: 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    .tech-badges span {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid #334155;
      color: #94a3b8;
    }
    .auth-form-side {
      flex: 1;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 3rem;
    }
    .auth-form-side h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 0.5rem;
    }
    .auth-form-side .subtitle {
      font-size: 0.95rem;
      color: #64748b;
      margin-bottom: 2rem;
    }
    .auth-form-side .form-group { margin-bottom: 1.25rem; }
    .auth-form-side .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #1e293b;
    }
    .auth-form-side .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
      background: #f8fafc;
    }
    .auth-form-side .form-group input:focus {
      outline: none;
      border-color: #f97316;
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.12);
      background: #ffffff;
    }
    .auth-form-side .btn-submit {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
      background: #f97316;
      color: #ffffff;
      margin-top: 0.5rem;
    }
    .auth-form-side .btn-submit:hover {
      background: #ea580c;
      transform: translateY(-1px);
    }
    .toggle-link {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      color: #f97316;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
    }
    .toggle-link:hover { text-decoration: underline; }
    .toggle-link.muted { color: #64748b; }
    .msg-box {
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-weight: 600;
      text-align: center;
      font-size: 0.9rem;
    }
    .msg-box.error { color: #ef4444; background: rgba(239,68,68,0.08); }
    .msg-box.success { color: #059669; background: rgba(5,150,105,0.08); }
    .hidden { display: none !important; }

    @media (max-width: 768px) {
      .auth-brand { display: none; }
      .auth-wrapper { width: 100%; border-radius: 0; min-height: 100vh; }
    }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <!-- Left: Brand Panel -->
    <div class="auth-brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      <h1>Savir Cloud</h1>
      <p>Plataforma de Gestão Empresarial na Nuvem AWS</p>
      <div class="tech-badges">
        <span>Java 17</span>
        <span>Spring Boot</span>
        <span>Microserviços</span>
        <span>MongoDB</span>
        <span>GRASP</span>
        <span>AWS</span>
      </div>
    </div>

    <!-- Right: Forms -->
    <div class="auth-form-side">
      <!-- LOGIN VIEW -->
      <div id="login-view">
        <h2>Entrar</h2>
        <p class="subtitle">Acesse sua conta para continuar</p>
        <div id="login-error" class="msg-box error hidden"></div>
        <form id="login-form">
          <div class="form-group">
            <label for="login">Usuário</label>
            <input type="text" id="login" required>
          </div>
          <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" required>
          </div>
          <button type="submit" class="btn-submit" id="btn-login">Entrar</button>
        </form>
        <a class="toggle-link" onclick="toggleView('register')">Não tem conta? Cadastre-se</a>
      </div>

      <!-- REGISTER VIEW -->
      <div id="register-view" class="hidden">
        <h2>Criar Conta</h2>
        <p class="subtitle">Junte-se ao Savir Cloud</p>
        <div id="register-msg" class="msg-box hidden"></div>
        <form id="register-form">
          <div class="form-group">
            <label for="reg-name">Nome Completo</label>
            <input type="text" id="reg-name" required>
          </div>
          <div class="form-group">
            <label for="reg-email">E-mail</label>
            <input type="email" id="reg-email" required>
          </div>
          <div class="form-group">
            <label for="reg-login">Login</label>
            <input type="text" id="reg-login" required>
          </div>
          <div class="form-group">
            <label for="reg-password">Senha</label>
            <input type="password" id="reg-password" required>
          </div>
          <button type="submit" class="btn-submit" id="btn-register">Criar Conta</button>
        </form>
        <a class="toggle-link muted" onclick="toggleView('login')">Já tem conta? Faça login</a>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    if (isLoggedIn()) window.location.href = 'dashboard.html';

    function toggleView(view) {
      document.getElementById('login-error').classList.add('hidden');
      document.getElementById('register-msg').classList.add('hidden');
      if (view === 'register') {
        document.getElementById('login-view').classList.add('hidden');
        document.getElementById('register-view').classList.remove('hidden');
      } else {
        document.getElementById('register-view').classList.add('hidden');
        document.getElementById('login-view').classList.remove('hidden');
      }
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      const err = document.getElementById('login-error');
      btn.textContent = 'Entrando...'; btn.disabled = true;
      err.classList.add('hidden');
      try {
        await login(document.getElementById('login').value, document.getElementById('password').value);
      } catch (ex) {
        err.textContent = ex.message; err.classList.remove('hidden');
        btn.textContent = 'Entrar'; btn.disabled = false;
      }
    });

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-register');
      const msgBox = document.getElementById('register-msg');
      btn.textContent = 'Criando...'; btn.disabled = true;
      msgBox.classList.add('hidden');

      const payload = {
        name: document.getElementById('reg-name').value,
        email: document.getElementById('reg-email').value,
        login: document.getElementById('reg-login').value,
        password: document.getElementById('reg-password').value,
        profile: 'Usuário'
      };

      try {
        const response = await fetch(AUTH_URL + '/api/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error || 'Erro ao criar conta');
        }
        msgBox.textContent = 'Conta criada! Redirecionando para o login...';
        msgBox.className = 'msg-box success';
        document.getElementById('register-form').reset();
        btn.textContent = 'Criar Conta'; btn.disabled = false;
        setTimeout(() => toggleView('login'), 1500);
      } catch (ex) {
        msgBox.textContent = ex.message;
        msgBox.className = 'msg-box error';
        btn.textContent = 'Criar Conta'; btn.disabled = false;
      }
    });
  </script>
</body>
</html>
